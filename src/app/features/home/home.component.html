<div class="min-h-screen px-4 sm:px-6 lg:px-8 py-6 max-w-7xl mx-auto">
	<!-- Hero Section -->
	<section id="hero-section" class="mb-16 lg:mb-24">
		<app-hero-section />
	</section>

	<!-- Scroll-Scrubbed Architecture Pipeline Showcase -->
	<section id="pipeline" class="mb-20 lg:mb-28">
		<app-scroll-scrubber />
	</section>

    <!-- Work Experience (deferred) -->
    @defer (on viewport) {
      <section id="work" class="mb-20 lg:mb-28">
        <app-work />
      </section>
    } @placeholder {
      <section class="mb-16">
        <div class="rounded-xl border border-contrast bg-surface p-6 animate-pulse">
          <div class="h-6 w-32 bg-gray-700 rounded mb-4"></div>
          <div class="h-4 w-11/12 bg-gray-800 rounded"></div>
        </div>
      </section>
    }

    <!-- Skills Section (deferred) -->
    @defer (on viewport) {
      <section id="skills" class="mb-20 lg:mb-28">
        <app-skills />
      </section>
    } @placeholder {
      <section class="mb-16">
        <div class="rounded-xl border border-contrast bg-surface p-6 animate-pulse" aria-busy="true" aria-live="polite">
          <div class="h-6 w-40 bg-gray-700 rounded mb-4"></div>
          <div class="h-4 w-full bg-gray-800 rounded"></div>
        </div>
      </section>
    }

	<!-- Projects Carousel / Grid -->
	@defer (on viewport) {
		<section id="projects" class="mb-20 lg:mb-28">
			<app-projects />
		</section>
	} @placeholder {
		<section class="mb-16">
			<div class="rounded-xl border border-contrast bg-surface p-6 animate-pulse">
				<div class="h-6 w-36 bg-gray-700 rounded mb-4"></div>
				<div class="h-4 w-full bg-gray-800 rounded"></div>
			</div>
		</section>
	}

    <!-- Articles Section (deferred) -->
    @defer (on viewport) {
      <section id="articles" class="mt-16 mb-16">
        <app-articles />
      </section>
    } @placeholder {
      <section class="mt-16 mb-16">
        <div class="rounded-xl border border-contrast bg-surface p-6 animate-pulse">
          <div class="h-6 w-36 bg-gray-700 rounded mb-4"></div>
          <div class="h-4 w-full bg-gray-800 rounded"></div>
          <div class="h-4 w-10/12 bg-gray-800 rounded mt-2"></div>
        </div>
      </section>
    }
</div>
