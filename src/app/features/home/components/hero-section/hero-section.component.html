<div class="relative flex flex-col lg:flex-row lg:justify-between lg:items-center gap-10 lg:gap-14 py-4">
  <!-- Content Section -->
  <div class="flex-1 flex flex-col justify-center order-2 lg:order-1 z-10">
    <!-- Status Pill -->
    <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-500/10 border border-blue-500/25 text-blue-400 text-xs font-mono font-medium mb-5 w-fit">
      <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
      <span>{{ heroContent.badge }}</span>
    </div>

    <!-- Main Title -->
    <h1 class="hero-title text-3xl sm:text-4xl lg:text-5xl xl:text-6xl font-mono font-bold tracking-tight text-white mb-5 leading-tight">
      {{ heroContent.headlinePrefix }}<br />
      <span class="bg-gradient-to-r from-blue-400 via-cyan-400 to-emerald-400 bg-clip-text text-transparent">
        {{ heroContent.headlineAccent }}
      </span>
    </h1>

    <!-- Description -->
    <p class="hero-description text-muted text-sm sm:text-base lg:text-lg leading-relaxed max-w-2xl mb-8">
      {{ heroContent.description }}
    </p>

    <!-- Key Metrics Ribbon -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">
      <div
        *ngFor="let m of heroMetrics"
        class="p-3 rounded-xl bg-surface border border-contrast hover:border-blue-500/40 transition-colors"
      >
        <div class="text-xl sm:text-2xl font-mono font-bold text-white">
          {{ m.value }}
        </div>
        <div class="text-xs font-mono text-blue-400 font-semibold">
          {{ m.label }}
        </div>
        <div class="text-[10px] text-muted truncate mt-0.5">
          {{ m.note }}
        </div>
      </div>
    </div>

    <!-- CTA & Social Buttons -->
    <div class="flex flex-wrap items-center gap-4 pt-2">
      <a
        routerLink="/architectures"
        class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-mono text-sm font-semibold transition-all duration-200 shadow-lg shadow-blue-500/20 hover:scale-[1.02]"
      >
        <span>Explorar Arquitecturas</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </a>

      <a
        href="#work"
        class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-surface hover:bg-surface-hover text-white border border-contrast hover:border-blue-500/40 font-mono text-sm font-medium transition-all duration-200"
      >
        <span>Ver Experiencia</span>
        <svg class="w-4 h-4 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </a>

      <!-- Social Links -->
      <div class="hero-social flex items-center gap-3 sm:gap-4 ml-auto pt-2 sm:pt-0">
        <a 
          *ngFor="let link of socialLinks; trackBy: trackBySocialLink"
          [href]="link.href" 
          target="_blank" 
          rel="noopener noreferrer"
          class="social-link p-2.5 rounded-lg border border-contrast bg-surface text-muted hover:text-blue-400 hover:border-blue-500/50 transition-all duration-200"
          [attr.aria-label]="link.label"
          [title]="link.name"
        >
          <fa-icon [icon]="link.icon" class="text-lg"></fa-icon>
        </a>
      </div>
    </div>
  </div>

  <!-- Profile Image / Interactive Tech Visual -->
  <div class="flex-1 flex justify-center lg:justify-end order-1 lg:order-2 z-10">
    <div class="hero-image relative w-full max-w-md sm:max-w-lg lg:max-w-xl group">
      <!-- Glow Underlay -->
      <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 via-cyan-500 to-emerald-500 rounded-2xl blur-xl opacity-25 group-hover:opacity-40 transition duration-500"></div>

      <!-- Image Card -->
      <div class="relative rounded-2xl overflow-hidden border border-contrast bg-surface shadow-2xl">
        <img
          [src]="heroContent.image.src"
          [alt]="heroContent.image.alt"
          class="w-full h-72 sm:h-88 lg:h-96 object-cover object-center filter contrast-105 group-hover:scale-102 transition duration-500"
          loading="eager"
        />

        <!-- Overlay Badge Details -->
        <div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black/90 via-black/60 to-transparent backdrop-blur-[2px]">
          <div class="flex items-center justify-between text-xs font-mono text-gray-300">
            <span class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              Tech Lead & Architect
            </span>
            <span class="text-muted">AICSAC & Sintad</span>
          </div>
          <div class="flex flex-wrap gap-1 mt-2">
            <span class="px-2 py-0.5 rounded bg-white/10 text-[11px] font-mono text-gray-200">GCP</span>
            <span class="px-2 py-0.5 rounded bg-white/10 text-[11px] font-mono text-gray-200">AWS</span>
            <span class="px-2 py-0.5 rounded bg-white/10 text-[11px] font-mono text-gray-200">GraphRAG</span>
            <span class="px-2 py-0.5 rounded bg-white/10 text-[11px] font-mono text-gray-200">Neo4j</span>
            <span class="px-2 py-0.5 rounded bg-white/10 text-[11px] font-mono text-gray-200">FastAPI</span>
            <span class="px-2 py-0.5 rounded bg-white/10 text-[11px] font-mono text-gray-200">Debezium</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
